name: Daily Edition

on:
  schedule:
    - cron: '40 0 * * *' # every day at 06:10 IST (00:40 UTC)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'assets/**', 'test/**', 'package.json']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: edition
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Self-check
        run: npm test

      - name: Collect the wires and print the edition
        run: npm run build

      - name: Commit the edition
        run: |
          git config user.name "The Tech Express"
          git config user.email "actions@users.noreply.github.com"
          git add data public
          git diff --cached --quiet || git commit -m "edition: $(date -u +%F)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
